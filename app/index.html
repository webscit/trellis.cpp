<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trellis Studio</title>
    <!-- The vendored <model-viewer> (three.js-based) is loaded at runtime from
         public/vendor by viewer.ts, so Vite doesn't try to bundle it. -->
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◈</span> Trellis Studio
      </div>
      <div class="status">
        <span id="backend-badge" class="badge" title="active backend">—</span>
        <span id="server-dot" class="dot" title="server status"></span>
        <span id="server-label" class="server-label">connecting…</span>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <div id="setup-banner" class="banner hidden">
      <span></span>
      <button id="banner-settings" class="link-btn">Open settings</button>
    </div>

    <main class="workspace">
      <section class="panel panel-left">
        <div class="mode-switch" role="tablist" aria-label="What to make">
          <button id="mode-image" type="button" role="tab" data-mode="image" aria-selected="true">Generate from image</button>
          <button id="mode-mesh" type="button" role="tab" data-mode="mesh" aria-selected="false"
                  title="Paint an STL, OBJ or GLB you already have from a photo, keeping its triangles">Paint a mesh</button>
        </div>

        <div id="mesh-zone" class="meshzone hidden" tabindex="0">
          <div id="mesh-hint" class="mesh-hint">
            <b>Drop a mesh</b><span class="muted">STL, OBJ or GLB · or click to browse</span>
          </div>
          <div id="mesh-info" class="mesh-info hidden">
            <span class="mesh-icon">◇</span>
            <div class="mesh-text" title="Show the mesh and its orientation">
              <b id="mesh-name"></b>
              <span id="mesh-stats" class="muted"></span>
            </div>
            <button id="mesh-change" class="link-btn" type="button" title="Pick another mesh">Change</button>
            <button id="mesh-clear" class="mesh-clear" type="button" title="Remove the mesh">✕</button>
          </div>
          <input id="mesh-input" type="file" accept=".stl,.obj,.glb" hidden />
        </div>

        <div id="dropzone" class="dropzone" tabindex="0">
          <img id="input-preview" class="input-preview hidden" alt="input" />
          <div id="dropzone-hint" class="dropzone-hint">
            <div class="dz-icon">⬆</div>
            <div id="dropzone-text">Drop an image here</div>
            <div class="muted">or click to browse</div>
          </div>
          <span id="front-tag" class="front-tag hidden">main · front · 0°</span>
          <input id="file-input" type="file" accept="image/*" multiple hidden />
        </div>

        <div id="views" class="views">
          <div class="views-head">
            <span>Extra views <span class="muted">· same object, other angles</span></span>
            <button id="clear-views" class="link-btn hidden">Clear</button>
          </div>
          <div id="views-list" class="views-list"></div>
          <button id="add-view" class="tool-btn add-view" type="button">+ Add view</button>
          <input id="view-input" type="file" accept="image/*" multiple hidden />
        </div>

        <div class="controls">
          <label class="ctl">
            <span>Resolution</span>
            <select id="ctl-res">
              <option id="res-512" value="512">512 · light</option>
              <option id="res-1024" value="1024" selected>1024 · cascade</option>
              <option id="res-1536" value="1536">1536 · high</option>
            </select>
          </label>
          <label class="ctl">
            <span>Background removal</span>
            <select id="ctl-bg">
              <option value="auto" selected>auto</option>
              <option value="birefnet">birefnet</option>
              <option value="threshold">threshold</option>
            </select>
          </label>
          <label class="ctl">
            <span>UV unwrap</span>
            <select id="ctl-uv">
              <option value="xatlas" selected>xatlas</option>
              <option value="box">box (faster)</option>
            </select>
          </label>
          <label id="ctl-tex-wrap" class="ctl">
            <span>Texture</span>
            <select id="ctl-tex">
              <option value="on" selected>on</option>
              <option value="off">off (geometry only)</option>
            </select>
          </label>
          <label id="ctl-print-wrap" class="ctl" title="Rebuild the mesh as one closed, manifold solid a slicer accepts. Slower.">
            <span id="ctl-print-label">3D print</span>
            <select id="ctl-print">
              <option value="off" selected>off</option>
              <option id="ctl-print-on" value="on">watertight solid</option>
            </select>
          </label>
          <div id="print-opts" class="print-opts hidden">
            <label class="ctl" title="Longest side of the printed model. The 3MF is written at this size.">
              <span class="ctl-head">
                Print size (mm)
                <span id="print-size-file-wrap" class="ctl-check hidden"
                      title="The 3MF at the mesh's own size: STL / OBJ units read as millimetres, GLB as metres">
                  <input id="ctl-print-size-file" type="checkbox" checked /> from file
                </span>
              </span>
              <input id="ctl-print-size" type="number" min="5" max="2000" step="5" value="100" />
            </label>
            <label id="print-base-wrap" class="ctl" title="A flat face to sit on the build plate. Auto picks the lowest cut the model stands on, or adds a thin pedestal.">
              <span>Flat base</span>
              <select id="ctl-print-base">
                <option value="auto" selected>auto · stable, pedestal if needed</option>
                <option value="0.01">cut 1% of the height</option>
                <option value="0.02">cut 2% of the height</option>
                <option value="0.05">cut 5% of the height</option>
                <option value="0">none</option>
              </select>
            </label>
            <label id="print-wall-wrap" class="ctl" title="Fins, edges and strands thinner than this are thickened, and so are joints between thick parts (a wrist, an ankle) narrower than twice it; the rest of the model is not touched. 0 turns it off.">
              <span>Minimum wall (mm)</span>
              <input id="ctl-print-wall" type="number" min="0" max="20" step="0.1" value="0.8" />
            </label>
            <label id="print-interior-wrap" class="ctl" title="Generated surfaces have tears. Auto seals them and keeps wide openings (the mouth of a cup or a vase) open. Solid fills those too. Hollow seals nothing.">
              <span>Interior</span>
              <select id="ctl-print-interior">
                <option value="auto" selected>auto · seal tears, keep cups open</option>
                <option value="solid">solid · fill everything</option>
                <option value="hollow">hollow · seal nothing</option>
              </select>
            </label>
            <label class="ctl" title="Most FDM slicers ignore a 3MF's texture. With a number here the 3MF carries that many filament colours instead, painted the way Orca-family slicers read it (checked in Snapmaker Orca); the filament list opens with those colours.">
              <span>3MF colours</span>
              <select id="ctl-print-colors">
                <option value="0" selected>texture · no filament colours</option>
                <option value="4">4 filament colours</option>
                <option value="8">8 filament colours</option>
                <option value="12">12 filament colours</option>
                <option value="16">16 filament colours</option>
                <option value="24">24 filament colours</option>
                <option value="32">32 filament colours</option>
              </select>
            </label>
            <label id="print-color-res-wrap" class="ctl hidden"
                   title="Large triangles are painted in parts down to this size (Orca split painting); the triangles themselves are not changed.">
              <span>Colour detail</span>
              <select id="ctl-print-color-res">
                <option value="0.5">0.5 mm · finest</option>
                <option value="1" selected>1 mm · default</option>
                <option value="2">2 mm · coarser, smaller file</option>
                <option value="0">whole triangles</option>
              </select>
            </label>
          </div>
          <label class="ctl">
            <span>Seed</span>
            <input id="ctl-seed" type="number" min="0" step="1" value="42" />
          </label>
          <details id="mv-adv" class="adv hidden">
            <summary>Multi-view blending</summary>
            <label class="ctl">
              <span>Blend temperature (higher = each region follows its closest view)</span>
              <input id="ctl-blend" type="number" min="0.1" max="20" step="0.5" value="2" />
            </label>
            <label class="ctl">
              <span>Front axis</span>
              <select id="ctl-front">
                <option value="-y" selected>-y (default)</option>
                <option value="+y">+y (object faces away)</option>
                <option value="+x">+x</option>
                <option value="-x">-x</option>
                <option value="ref-z">ref-z (ComfyUI compatible)</option>
                <option value="ref-x">ref-x (ComfyUI compatible)</option>
              </select>
            </label>
            <label class="ctl">
              <span>Pose (the model picks its own orientation; auto turns the directions to match it)</span>
              <select id="ctl-yaw">
                <option value="given" selected>Directions as given</option>
                <option value="auto">Auto-detect from silhouettes</option>
              </select>
            </label>
            <label class="ctl">
              <span>Overall shape</span>
              <select id="ctl-ss">
                <option value="blend">Blend all views</option>
                <option value="union">Front view + blend (keeps the outline)</option>
                <option value="fill" selected>Blend, front outline restored (default)</option>
              </select>
            </label>
            <label class="ctl">
              <span>Texture</span>
              <select id="ctl-vis">
                <option value="off" selected>Blend by direction</option>
                <option value="on">Only from views that can see the surface</option>
              </select>
            </label>
          </details>
        </div>

        <button id="generate-btn" class="primary" disabled>Generate 3D</button>

        <div id="progress" class="progress hidden">
          <div class="bar"><div class="bar-fill"></div></div>
          <div id="progress-stage" class="progress-stage muted">starting…</div>
          <div id="progress-elapsed" class="progress-elapsed muted">0:00</div>
          <button id="cancel-btn" class="link-btn">Cancel</button>
        </div>
      </section>

      <section class="panel viewer-panel">
        <div id="viewer-mount" class="viewer-mount"></div>
        <div id="orient-bar" class="orient-bar hidden">
          <label class="orient-up" title="The axis of the file that points up">
            <span>Up</span>
            <select id="orient-up"></select>
          </label>
          <div class="orient-turn">
            <span>Turn</span>
            <button id="turn-ccw" class="tool-btn" type="button" title="Turn 90° counter-clockwise, seen from above">⟲ 90°</button>
            <span id="turn-value" class="turn-value">0°</span>
            <button id="turn-cw" class="tool-btn" type="button" title="Turn 90° clockwise, seen from above">⟳ 90°</button>
          </div>
          <span class="orient-hint muted">Turn the mesh so the side in the photo faces you.</span>
        </div>
        <details id="print-report" class="print-report hidden">
          <summary>
            <span id="print-report-badge" class="report-badge"></span>
            <span id="print-report-line"></span>
          </summary>
          <dl id="print-report-rows" class="report-rows"></dl>
          <ul id="print-report-warnings" class="report-warnings"></ul>
        </details>
        <div class="viewer-toolbar">
          <button id="reset-view" class="tool-btn" disabled>Reset view</button>
          <div class="split-btn">
            <button id="export-btn" class="tool-btn split-main" disabled>Export to GLB</button>
            <button id="export-menu-btn" class="tool-btn split-arrow" disabled
                    aria-haspopup="menu" aria-expanded="false" aria-label="Choose export format">▾</button>
            <div id="export-menu" class="split-menu hidden" role="menu">
              <button role="menuitemradio" data-format="glb" aria-checked="true">
                <b>GLB</b><span class="muted">textured model</span>
              </button>
              <button role="menuitemradio" data-format="3mf" aria-checked="false">
                <b>3MF</b><span class="muted">3D printing, millimetres</span>
              </button>
            </div>
          </div>
          <span id="viewer-caption" class="viewer-caption muted"></span>
        </div>
      </section>
    </main>

    <section class="gallery-wrap">
      <div class="gallery-head">
        <span>Gallery</span>
        <button id="clear-gallery" class="link-btn">Clear all</button>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <span>Settings</span>
          <button id="settings-close" class="icon-btn">✕</button>
        </div>
        <div id="settings-body" class="modal-body"></div>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
